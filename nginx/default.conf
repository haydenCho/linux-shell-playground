# WebSocket 업그레이드용 매핑 (http 컨텍스트)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       80;
    listen  [::]:80;
    server_name  192.168.100.65;   # 본인 호스트 IP (아무 값이나 두거나 _ 로 해도 됨)

    #access_log  /var/log/nginx/host.access.log  main;

    # Docker 내장 DNS. upstream 을 시작 시점이 아니라 요청 시점에 해석하게 함
    resolver 127.0.0.11 valid=30s;

    # ── 공통 프록시 헤더 (WebSocket 포함) ──
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # ── OS 선택 페이지 (정적 서빙, 프록시 아님) ──
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }

    # ── 각 OS 터미널 → ttyd 인스턴스로 프록시 ──
    #  - upstream 은 컨테이너 IP 가 아니라 compose 서비스명 'ttyd' 로 접근
    #  - ttyd 의 --base-path(/term/<os>)를 유지해야 하므로
    #    proxy_pass 뒤에 경로/슬래시를 붙이지 않는다(=원본 URI 그대로 전달)
    #  - 변수(set)를 쓰면 nginx 가 시작 시가 아닌 요청 시에 DNS 를 해석한다.
    #    변수 사용 시 URI 는 $request_uri 로 원본 경로를 그대로 넘긴다.
    set $ttyd_host ttyd;
    location /term/ubuntu2404/ { proxy_pass http://$ttyd_host:7681$request_uri; }
    location /term/ubuntu2604/ { proxy_pass http://$ttyd_host:7682$request_uri; }
    location /term/rocky89/    { proxy_pass http://$ttyd_host:7683$request_uri; }
    location /term/rocky93/    { proxy_pass http://$ttyd_host:7684$request_uri; }
    location /term/kali/       { proxy_pass http://$ttyd_host:7685$request_uri; }

    # redirect server error pages to the static page /50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
